<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Card</title>
<link rel="icon" type="image/ico" href="favicon.ico">

<style>
/* --- VARIABEL WARNA --- */
:root {
  --bg-color: #e0e5ec;
  --text-main: #4d4d4d;
  --text-sub: #8993a4;
  --shadow-light: #ffffff;
  --shadow-dark: #a3b1c6;
  --accent-red: #ef4444;
  --accent-green: #25D366;
  --accent-blue: #2563eb;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg-color);
  display: flex;
  justify-content: center;
  padding-bottom: 120px;
  color: var(--text-main);
}

/* ========== LOADER OVERLAY (PEMBUKA) ========== */
.loader-overlay {
  --ld-bg: #e0e0e0;
  --ld-shadow-dark: #bebebe;
  --ld-shadow-light: #ffffff;
  --ld-dot-size: 14px;

  position: fixed;
  inset: 0;
  background: var(--ld-bg);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loader {
  display: flex;
  gap: 12px;
}

.loader span {
  width: var(--ld-dot-size);
  height: var(--ld-dot-size);
  border-radius: 50%;
  background: var(--ld-bg);
  box-shadow: 6px 6px 12px var(--ld-shadow-dark),
             -6px -6px 12px var(--ld-shadow-light);
  animation: neumorphPulse 1.2s infinite ease-in-out;
}

.loader span:nth-child(2) { animation-delay: 0.2s; }
.loader span:nth-child(3) { animation-delay: 0.4s; }

@keyframes neumorphPulse {
  0%, 100% {
    box-shadow: 6px 6px 12px var(--ld-shadow-dark),
               -6px -6px 12px var(--ld-shadow-light);
    transform: scale(1);
  }
  50% {
    box-shadow: inset 4px 4px 8px var(--ld-shadow-dark),
                inset -4px -4px 8px var(--ld-shadow-light);
    transform: scale(1.25);
  }
}
/* ========== AKHIR LOADER ========== */

.card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-color);
  border-radius: 30px;
  box-shadow: 9px 9px 16px var(--shadow-dark), 
              -9px -9px 16px var(--shadow-light);
  margin-top: 20px;
  padding-bottom: 30px;
  position: relative;
  overflow: hidden;
}

.header {
  position: relative;
  height: 280px;
  background: var(--bg-color);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom-left-radius: 30px;
  border-bottom-right-radius: 30px;
  box-shadow: inset 5px 5px 10px var(--shadow-dark), 
              inset -5px -5px 10px var(--shadow-light);
  margin: 15px;
  border-radius: 20px;
}

.header img {
  width: 85%;
  max-width: 300px;
  z-index: 2;
  filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.2));
}

.content {
  padding: 20px 30px;
}

.name-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 35px;
}

.name {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-main);
  margin: 0;
  padding: 8px 20px;
  background: var(--bg-color);
  border-radius: 16px;
  box-shadow: 
    4px 4px 8px var(--shadow-dark), 
    -4px -4px 8px var(--shadow-light);
  text-shadow: 1px 1px 1px rgba(0,0,0,0.05);
  display: inline-block;
  position: relative;
  line-height: 1.3;
}

.name-logo {
  padding: 5px;
  border-radius: 18px;
  background: var(--bg-color);
  box-shadow: 5px 5px 10px var(--shadow-dark), 
              -5px -5px 10px var(--shadow-light);
}

.name-logo img {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  object-fit: cover;
  display: block;
}

.row {
  display: flex;
  align-items: center;
  margin-bottom: 25px;
  padding: 15px;
  border-radius: 20px;
  box-shadow: 5px 5px 10px var(--shadow-dark), 
              -5px -5px 10px var(--shadow-light);
  transition: transform 0.2s ease;
}

.row:active {
  box-shadow: inset 3px 3px 7px var(--shadow-dark), 
              inset -3px -3px 7px var(--shadow-light);
  transform: scale(0.98);
}

.icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--bg-color);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 20px;
  box-shadow: 3px 3px 6px var(--shadow-dark), 
              -3px -3px 6px var(--shadow-light);
  border: 1px solid rgba(255,255,255,0.2);
}

.icon svg {
  width: 24px;
  height: 24px;
  fill: var(--accent-red);
  filter: drop-shadow(1px 1px 1px rgba(255,255,255,0.8));
}

.icon.whatsapp svg {
  fill: var(--accent-green);
}

.icon.email svg {
  fill: var(--accent-blue);
}

.text {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
  text-decoration: none;
}

.sub {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 4px;
}

.floating-save {
  position: fixed;
  bottom: 85px;
  width: 100%;
  max-width: 420px;
  display: flex;
  justify-content: center;
  z-index: 999;
  pointer-events: none;
}

.floating-save button {
  pointer-events: auto;
  width: 85%;
  background: var(--bg-color);
  color: var(--accent-red);
  font-weight: 800;
  border: none;
  padding: 18px;
  border-radius: 50px;
  font-size: 16px;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 8px 8px 16px var(--shadow-dark), 
              -8px -8px 16px var(--shadow-light);
  transition: all 0.2s ease;
}

.floating-save button:active {
  box-shadow: inset 4px 4px 8px var(--shadow-dark), 
              inset -4px -4px 8px var(--shadow-light);
  color: #c0392b;
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-color);
  z-index: 2000;
  display: none;
  flex-direction: column;
}

.overlay-header {
  padding: 30px;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  text-align: center;
}

.overlay form {
  padding: 0 30px 40px;
}

.field {
  margin-bottom: 25px;
}

.field label {
  font-size: 14px;
  color: var(--text-sub);
  display: block;
  margin-bottom: 10px;
  font-weight: 600;
  margin-left: 10px;
}

.field input {
  width: 100%;
  border: none;
  background: var(--bg-color);
  padding: 16px 20px;
  font-size: 16px;
  border-radius: 50px;
  color: var(--text-main);
  outline: none;
  box-shadow: inset 6px 6px 12px var(--shadow-dark), 
              inset -6px -6px 12px var(--shadow-light);
  transition: all 0.3s ease;
}

.field input:focus {
  box-shadow: inset 3px 3px 6px var(--shadow-dark), 
              inset -3px -3px 6px var(--shadow-light);
  color: var(--accent-blue);
}

.submit-btn {
  margin-top: 20px;
  width: 100%;
  background: var(--bg-color);
  color: var(--accent-blue);
  border: none;
  padding: 18px;
  font-size: 18px;
  border-radius: 50px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 6px 6px 12px var(--shadow-dark), 
              -6px -6px 12px var(--shadow-light);
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.submit-btn:active {
  box-shadow: inset 4px 4px 8px var(--shadow-dark), 
              inset -4px -4px 8px var(--shadow-light);
}

.submit-btn:disabled {
  color: var(--text-sub);
  cursor: not-allowed;
  box-shadow: none;
  background: #e0e5ec;
  border: 1px solid rgba(255,255,255,0.5);
}

.spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(37, 99, 235, 0.3);
  border-radius: 50%;
  border-top-color: var(--accent-blue);
  animation: spin 1s ease-in-out infinite;
  margin-right: 10px;
  vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }
.submit-btn.loading .spinner { display: inline-block; }

.privacy {
  text-align: center;
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 25px;
}

.close-overlay {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-color);
  border: none;
  color: var(--text-sub);
  font-weight: bold;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("WcMFHvC566CcQz3Os");
})();

/* HILANGKAN LOADER SETELAH HALAMAN SELESAI DIMUAT */
window.addEventListener('load', function() {
  const loader = document.getElementById('loaderOverlay');
  if (loader) {
    // opsional: tambahkan transisi halus
    loader.style.transition = 'opacity 0.4s ease';
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.style.display = 'none';
    }, 400);
  }
});

function openForm(){
  document.getElementById('formOverlay').style.display = 'flex';
}

function closeForm(){
  document.getElementById('formOverlay').style.display = 'none';
}

function downloadVCF(){
  const vcf = `BEGIN:VCARD
VERSION:3.0
FN:Andrea Rey Y
TEL;TYPE=CELL:+628996977888
TEL;TYPE=WHATSAPP:+16096160899
EMAIL;TYPE=HOME:andrearey@duck.com
END:VCARD`;

  const blob = new Blob([vcf], { type: "text/vcard" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "contact.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
   
  return new Promise(resolve => setTimeout(resolve, 1500));
}

async function sendForm(e){
  e.preventDefault();
   
  const submitBtn = document.getElementById('continueBtn');
  const btnText = submitBtn.querySelector('.btn-text');
   
  submitBtn.disabled = true;
  submitBtn.classList.add('loading');
  btnText.innerText = 'Processing...';
   
  const nameInput  = document.getElementById("name").value;
  const emailInput = document.getElementById("email").value;
  const phoneInput = document.getElementById("phone").value;

  try {
    await emailjs.send(
      "service_lwfbqfc",
      "template_d5l7weg",
      {
        name: nameInput,
        email: emailInput,
        phone: phoneInput
      }
    );
     
    await downloadVCF();
     
    closeForm();
    e.target.reset();
    alert("Contact saved successfully!");
     
  } catch (error) {
    alert("Failed to send data, but downloading contact anyway.");
    await downloadVCF();
    console.error(error);
  } finally {
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
    btnText.innerText = 'Download Contact';
  }
}
</script>
